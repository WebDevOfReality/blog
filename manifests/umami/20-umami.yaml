apiVersion: apps/v1
kind: Deployment
metadata:
  name: umami
  namespace: analytics
  labels:
    app: umami
spec:
  replicas: 1
  selector:
    matchLabels:
      app: umami
  template:
    metadata:
      labels:
        app: umami
    spec:
      containers:
      - name: umami
        image: ghcr.io/umami-software/umami:postgresql-latest
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          value: postgresql://umami:$(POSTGRES_PASSWORD)@umami-postgres:5432/umami
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: umami-secrets
              key: postgres-password
        - name: DATABASE_TYPE
          value: postgresql
        - name: APP_SECRET
          valueFrom:
            secretKeyRef:
              name: umami-secrets
              key: app-secret
        - name: HOSTNAME
          value: 0.0.0.0
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /api/heartbeat
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: umami
  namespace: analytics
spec:
  selector:
    app: umami
  ports:
  - port: 80
    targetPort: 3000